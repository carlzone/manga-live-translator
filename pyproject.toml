[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manga-live-translator"
version = "0.1.0"
description = "Offline selected-region manga and manhwa translation for Windows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ctranslate2>=4.6,<5",
    "numpy>=2.1,<3",
    "onnxruntime>=1.20,<2",
    "platformdirs>=4.3,<5",
    "pyside6>=6.8,<7",
    "rapidocr>=3.9,<4",
    "sentencepiece>=0.2,<0.3",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pyinstaller>=6.11,<7",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[project.gui-scripts]
manga-live-translator = "manga_live_translator.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/manga_live_translator"]

[tool.pytest.ini_options]
addopts = "--cov=manga_live_translator --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "*/manga_live_translator/app.py",
    "*/manga_live_translator/logging_config.py",
    "*/manga_live_translator/paths.py",
    "*/manga_live_translator/ui/*",
    "*/manga_live_translator/workers/ocr.py",
    "*/manga_live_translator/workers/text_translation.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["manga_live_translator"]
